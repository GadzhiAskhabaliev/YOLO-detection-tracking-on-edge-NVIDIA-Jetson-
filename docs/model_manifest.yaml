# Инвентарь кандидатов для бенчмарков. Полный контракт полей прогона: BENCHMARK_METRICS_SCHEMA.md
# Группа B (CrowdHuman и др.): docs/group_b_pedestrian_detectors.yaml

models:
  - name: yolov8n_crowdhuman
    backend: ultralytics_yolo
    status: smoke test after instance bootstrap
    weights_path: models/yolov8n_crowdhuman.pt
    group_B_detector_id: 6

  # Joint proxy на том же датасете / пайплайне, что и эксперименты детектора
  - name: yolov8s_crowdhuman_proxy
    backend: ultralytics_yolo
    status: planned
    weights_path: ""
    note: "Прокси для joint (в notes прогона указать: без трекера)."

  # MMDetection Model Zoo — после прогона в окружении mmcv: записать JSON с backend=mmdet
  - name: fcos_r50_caffe_fpn_gn-head_1x_coco
    backend: mmdet
    zoo_id: fcos_r50_caffe_fpn_gn-head_1x_coco
    status: planned
    weights_path: ""

  - name: ssd300_coco
    backend: mmdet
    zoo_id: ssd300_coco
    status: planned
    weights_path: ""

  - name: yolox_tiny_coco
    backend: mmdet
    zoo_id: yolox-tiny  # уточнить точное имя конфига в выбранной версии MMDet
    status: planned
    weights_path: ""

  - name: fairmot_dla34
    backend: fairmot
    status: planned
    weights_path: ""
    note: "Joint детектор+трекер: дет-метрики и tracking — см. BENCHMARK_METRICS_SCHEMA.md."

  # Группа B (остальное): CrowdDet, Pedestron, FreeYOLO, PeopleNet — см. group_b_pedestrian_detectors.yaml
